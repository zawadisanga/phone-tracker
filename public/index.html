<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Female Contacts - Direct Communication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #e9ecef;
            padding-bottom: 10px;
        }
        .female-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .female-item {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        .female-item:hover {
            background: #e9ecef;
            transform: translateX(5px);
        }
        .female-info h3 {
            color: #e83e8c;
            margin-bottom: 5px;
        }
        .female-info p {
            color: #666;
            font-size: 14px;
        }
        .female-actions {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-sms {
            background: #17a2b8;
            color: white;
        }
        .btn-call {
            background: #28a745;
            color: white;
        }
        .btn-delete {
            background: #dc3545;
            color: white;
        }
        .btn-add {
            background: #28a745;
            color: white;
            width: 100%;
            padding: 12px;
            font-size: 16px;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .status {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .online {
            color: #28a745;
            font-weight: bold;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
        }
        .modal-content h3 {
            margin-bottom: 15px;
        }
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .modal-buttons button {
            flex: 1;
        }
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 20px;
            background: #28a745;
            color: white;
            border-radius: 8px;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👩 Female Contacts</h1>
            <p>Wasiliana moja kwa moja na wanawake walio karibu nawe</p>
        </div>

        <div class="card">
            <h2>📊 Status</h2>
            <div class="status" id="serverStatus">
                Inaangalia server...
            </div>
        </div>

        <div class="card">
            <h2>👩 Orodha ya Wanawake (Karibu nawe)</h2>
            <div id="femaleList" class="female-list">
                <div class="empty-state">Loading...</div>
            </div>
        </div>

        <div class="card">
            <h2>➕ Ongeza Mwanamke Mpya</h2>
            <input type="text" id="newName" placeholder="Jina Kamili (mf: Fatma Hassan)">
            <input type="tel" id="newPhone" placeholder="Namba ya Simu (mf: +255712345678)">
            <input type="text" id="newDeviceId" placeholder="Device ID (optional)">
            <button id="addBtn" class="btn-add">➕ Ongeza Mwanamke</button>
        </div>
    </div>

    <!-- SMS Modal -->
    <div id="smsModal" class="modal">
        <div class="modal-content">
            <h3>📨 Tuma SMS</h3>
            <p><strong>Kwa:</strong> <span id="smsToName"></span></p>
            <p><strong>Namba:</strong> <span id="smsToPhone"></span></p>
            <textarea id="smsMessage" rows="4" placeholder="Andika ujumbe wako hapa..."></textarea>
            <div class="modal-buttons">
                <button id="sendSmsBtn" style="background: #17a2b8; color: white;">Tuma SMS</button>
                <button id="closeSmsModal" style="background: #6c757d; color: white;">Funga</button>
            </div>
        </div>
    </div>

    <!-- Call Modal -->
    <div id="callModal" class="modal">
        <div class="modal-content">
            <h3>📞 Piga Simu</h3>
            <p><strong>Kwa:</strong> <span id="callToName"></span></p>
            <p><strong>Namba:</strong> <span id="callToPhone"></span></p>
            <div class="modal-buttons">
                <button id="makeCallBtn" style="background: #28a745; color: white;">Piga Simu</button>
                <button id="closeCallModal" style="background: #6c757d; color: white;">Funga</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // DOM elements
        const femaleListDiv = document.getElementById('femaleList');
        const serverStatus = document.getElementById('serverStatus');
        const newName = document.getElementById('newName');
        const newPhone = document.getElementById('newPhone');
        const newDeviceId = document.getElementById('newDeviceId');
        const addBtn = document.getElementById('addBtn');
        
        // Modal elements
        const smsModal = document.getElementById('smsModal');
        const callModal = document.getElementById('callModal');
        const smsToName = document.getElementById('smsToName');
        const smsToPhone = document.getElementById('smsToPhone');
        const callToName = document.getElementById('callToName');
        const callToPhone = document.getElementById('callToPhone');
        const smsMessage = document.getElementById('smsMessage');
        
        let currentFemale = null;
        
        // Show notification
        function showNotification(message, type = 'success') {
            const notif = document.createElement('div');
            notif.className = 'notification';
            notif.style.background = type === 'success' ? '#28a745' : type === 'error' ? '#dc3545' : '#17a2b8';
            notif.textContent = message;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 3000);
        }
        
        // Load all females
        async function loadFemales() {
            try {
                const response = await fetch('/api/females');
                const data = await response.json();
                
                if (data.success && data.females.length > 0) {
                    const females = data.females;
                    
                    if (females.length === 0) {
                        femaleListDiv.innerHTML = `
                            <div class="empty-state">
                                📭 Hakuna wanawake kwenye database.<br>
                                Ongeza mwanamke kwanza!
                            </div>
                        `;
                        return;
                    }
                    
                    femaleListDiv.innerHTML = females.map(female => `
                        <div class="female-item">
                            <div class="female-info">
                                <h3>👩 ${female.ownerName}</h3>
                                <p>📞 ${female.phoneNumber}</p>
                                <p>🆔 ${female.deviceId}</p>
                                <p style="font-size: 12px; color: #999;">📅 ${new Date(female.registeredAt).toLocaleDateString()}</p>
                            </div>
                            <div class="female-actions">
                                <button class="btn-sms" onclick="openSMSModal('${female.ownerName}', '${female.phoneNumber}')">📨 SMS</button>
                                <button class="btn-call" onclick="openCallModal('${female.ownerName}', '${female.phoneNumber}')">📞 Simu</button>
                                <button class="btn-delete" onclick="deleteFemale('${female.deviceId}')">🗑️</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    femaleListDiv.innerHTML = `
                        <div class="empty-state">
                            📭 Hakuna wanawake kwenye database.<br>
                            Ongeza mwanamke kwanza!
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error loading females:', error);
                femaleListDiv.innerHTML = '<div class="empty-state">❌ Kosa la kupakia data</div>';
            }
        }
        
        // Add new female
        async function addFemale() {
            const name = newName.value.trim();
            const phone = newPhone.value.trim();
            const deviceId = newDeviceId.value.trim() || name.replace(/\s/g, '-').toUpperCase();
            
            if (!name || !phone) {
                showNotification('Tafadhali jaza Jina na Namba ya Simu', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/females', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        deviceId: deviceId,
                        deviceName: name + "'s Phone",
                        phoneNumber: phone,
                        ownerName: name
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification(`✅ ${name} ameongezwa kwenye database!`, 'success');
                    newName.value = '';
                    newPhone.value = '';
                    newDeviceId.value = '';
                    loadFemales();
                } else {
                    showNotification('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showNotification('Error adding female', 'error');
            }
        }
        
        // Delete female
        window.deleteFemale = async (deviceId) => {
            if (!confirm('Una uhakika unataka kumfuta mwanamke huyu?')) return;
            
            try {
                const response = await fetch(`/api/females/${deviceId}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('Mwanamke amefutwa!', 'success');
                    loadFemales();
                }
            } catch (error) {
                showNotification('Error deleting', 'error');
            }
        };
        
        // Open SMS modal
        window.openSMSModal = (name, phone) => {
            currentFemale = { name, phone };
            smsToName.textContent = name;
            smsToPhone.textContent = phone;
            smsMessage.value = `Habari ${name}, nimekugundua kupitia tracker yetu. Uko karibu nami. Tungependa kuwasiliana nawe.`;
            smsModal.classList.add('active');
        };
        
        // Open Call modal
        window.openCallModal = (name, phone) => {
            currentFemale = { name, phone };
            callToName.textContent = name;
            callToPhone.textContent = phone;
            callModal.classList.add('active');
        };
        
        // Send SMS
        function sendSMS() {
            const message = smsMessage.value.trim();
            
            if (!message) {
                showNotification('Tafadhali andika ujumbe', 'error');
                return;
            }
            
            showNotification(`📨 Inatuma SMS kwa ${currentFemale.name}...`, 'info');
            
            socket.emit('send-sms-to-female', {
                phoneNumber: currentFemale.phone,
                ownerName: currentFemale.name,
                message: message,
                distance: 5
            });
            
            smsModal.classList.remove('active');
        }
        
        // Make call
        function makeCall() {
            showNotification(`📞 Inampigia simu ${currentFemale.name}...`, 'info');
            
            socket.emit('call-female', {
                phoneNumber: currentFemale.phone,
                ownerName: currentFemale.name,
                distance: 5
            });
            
            callModal.classList.remove('active');
        }
        
        // Check server status
        async function checkServer() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (data.status === 'ok') {
                    serverStatus.innerHTML = `
                        ✅ Server Iko Online<br>
                        👩 Wanawake wanaofuatiliwa: ${data.females_tracked}<br>
                        🕐 ${new Date(data.timestamp).toLocaleString()}
                    `;
                } else {
                    serverStatus.innerHTML = '❌ Server Iko Offline';
                }
            } catch (error) {
                serverStatus.innerHTML = '❌ Haiwezi kuunganisha kwenye server. Hakikisha server imeanza.';
            }
        }
        
        // Socket events
        socket.on('sms-result', (data) => {
            if (data.success) {
                showNotification(`✅ SMS imetumwa kwa mafanikio!`, 'success');
            } else {
                showNotification(`❌ Kosa: ${data.error || 'SMS haikutumwa'}`, 'error');
            }
        });
        
        socket.on('call-result', (data) => {
            if (data.success) {
                showNotification(`✅ Simu inapigwa! ${data.message || ''}`, 'success');
            } else {
                showNotification(`❌ Kosa: ${data.error || 'Simu haikupigwa'}`, 'error');
            }
        });
        
        // Modal close buttons
        document.getElementById('closeSmsModal').addEventListener('click', () => {
            smsModal.classList.remove('active');
        });
        
        document.getElementById('closeCallModal').addEventListener('click', () => {
            callModal.classList.remove('active');
        });
        
        document.getElementById('sendSmsBtn').addEventListener('click', sendSMS);
        document.getElementById('makeCallBtn').addEventListener('click', makeCall);
        
        addBtn.addEventListener('click', addFemale);
        
        // Close modal when clicking outside
        window.addEventListener('click', (e) => {
            if (e.target === smsModal) smsModal.classList.remove('active');
            if (e.target === callModal) callModal.classList.remove('active');
        });
        
        // Initial load
        checkServer();
        loadFemales();
        
        // Auto refresh every 5 seconds
        setInterval(() => {
            loadFemales();
            checkServer();
        }, 5000);
        
        console.log('✅ Female Contacts System Ready!');
        console.log('💡 Ongeza wanawake kwa mikono kwenye form');
    </script>
</body>
</html>
