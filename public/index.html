<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Female Phone Tracker - Track Within 10 Meters</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            padding: 20px;
        }

        header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-warning {
            background: #ffc107;
            color: #333;
        }

        .btn-sms {
            background: #17a2b8;
            color: white;
        }

        .btn-call {
            background: #28a745;
            color: white;
        }

        .status-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            text-align: center;
        }

        .indicator {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #ccc;
            display: inline-block;
            margin-right: 10px;
        }

        .indicator.scanning {
            background: #28a745;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
            border-bottom: 3px solid #667eea;
            display: inline-block;
            padding-bottom: 5px;
        }

        .devices-list {
            max-height: 400px;
            overflow-y: auto;
        }

        .device-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 4px solid #e83e8c;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .device-card:hover {
            transform: translateX(5px);
            background: #fff0f5;
        }

        .device-card h3 {
            color: #e83e8c;
            margin-bottom: 8px;
        }

        .device-card p {
            margin: 5px 0;
            color: #666;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        /* Communication Panel */
        .comms-panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }

        .input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .input:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea.input {
            resize: vertical;
            font-family: inherit;
        }

        .comms-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .comms-buttons .btn {
            flex: 1;
        }

        .comms-result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .comms-result.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .comms-result.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .comms-result.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .selected-device {
            background: #e8f4f8;
            border: 2px solid #17a2b8;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .button-group .btn {
            flex: 1;
            padding: 8px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .comms-buttons {
                flex-direction: column;
            }
            .controls {
                flex-direction: column;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>👩 Female Phone Tracker</h1>
            <p>Gundua, fuatilia na wasiliana na wanawake ndani ya mita 10</p>
        </header>

        <div class="controls">
            <button id="startScanBtn" class="btn btn-primary">🔍 Anza Utafutaji</button>
            <button id="stopScanBtn" class="btn btn-secondary" disabled>⏹️ Simamisha</button>
        </div>

        <div class="status-card">
            <div>
                <div class="indicator" id="scanStatus"></div>
                <span id="statusText">Hajajaanza</span>
            </div>
            <div id="distanceInfo" style="margin-top: 15px; color: #666;"></div>
        </div>

        <div class="section">
            <h2>👩 Wanawake Waliogunduliwa (Mita 10)</h2>
            <div id="femaleDevices" class="devices-list">
                <div class="empty-state">
                    📱 Hakuna mwanamke aliye karibu ndani ya mita 10
                </div>
            </div>
        </div>

        <div class="section">
            <h2>📨 Wasiliana na Mwanamke</h2>
            <div class="comms-panel">
                <div class="input-group">
                    <label>📞 Namba ya Simu</label>
                    <input type="tel" id="commsPhone" class="input" placeholder="+255712345678">
                </div>
                <div class="input-group">
                    <label>👩 Jina la Mwanamke</label>
                    <input type="text" id="commsName" class="input" placeholder="Jina la mwanamke">
                </div>
                <div class="input-group">
                    <label>💬 Ujumbe wako</label>
                    <textarea id="commsMessage" class="input" rows="4" placeholder="Andika ujumbe wako hapa...&#10;&#10;Mfano: Habari Fatma, nimekugundua karibu nami. Tungependa kuwasiliana nawe."></textarea>
                </div>
                <div class="comms-buttons">
                    <button id="sendSmsBtn" class="btn btn-sms">📨 TUMA SMS</button>
                    <button id="makeCallBtn" class="btn btn-call">📞 PIGA SIMU</button>
                </div>
                <div id="commsResult" class="comms-result"></div>
            </div>
        </div>

        <div class="section">
            <h2>➕ Ongeza Mwanamke Kwenye Database</h2>
            <div class="comms-panel">
                <div class="input-group">
                    <label>🆔 Device ID</label>
                    <input type="text" id="newDeviceId" class="input" placeholder="Kwa mfano: FATMA-001">
                </div>
                <div class="input-group">
                    <label>📱 Jina la Kifaa</label>
                    <input type="text" id="newDeviceName" class="input" placeholder="Kwa mfano: Fatma's iPhone">
                </div>
                <div class="input-group">
                    <label>📞 Namba ya Simu</label>
                    <input type="tel" id="newPhoneNumber" class="input" placeholder="+255712345678">
                </div>
                <div class="input-group">
                    <label>👩 Jina Kamili</label>
                    <input type="text" id="newOwnerName" class="input" placeholder="Kwa mfano: Fatma Hassan">
                </div>
                <button id="addDeviceBtn" class="btn btn-success">➕ Ongeza Mwanamke</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        // DOM elements
        const startScanBtn = document.getElementById('startScanBtn');
        const stopScanBtn = document.getElementById('stopScanBtn');
        const scanStatus = document.getElementById('scanStatus');
        const statusText = document.getElementById('statusText');
        const distanceInfo = document.getElementById('distanceInfo');
        const femaleDevicesDiv = document.getElementById('femaleDevices');
        const commsPhone = document.getElementById('commsPhone');
        const commsName = document.getElementById('commsName');
        const commsMessage = document.getElementById('commsMessage');
        const sendSmsBtn = document.getElementById('sendSmsBtn');
        const makeCallBtn = document.getElementById('makeCallBtn');
        const commsResult = document.getElementById('commsResult');
        const addDeviceBtn = document.getElementById('addDeviceBtn');
        const newDeviceId = document.getElementById('newDeviceId');
        const newDeviceName = document.getElementById('newDeviceName');
        const newPhoneNumber = document.getElementById('newPhoneNumber');
        const newOwnerName = document.getElementById('newOwnerName');

        let isScanning = false;
        let scanner = null;
        let detectedFemales = [];

        // Bluetooth Scanner Class
        class BluetoothScanner {
            constructor() {
                this.device = null;
                this.isScanning = false;
                this.interval = null;
            }

            calculateDistance(rssi) {
                const txPower = -59;
                const ratio = (txPower - rssi) / (10 * 2);
                const distance = Math.pow(10, ratio);
                return Math.min(50, Math.max(0.5, distance));
            }

            async startScanning() {
                if (!navigator.bluetooth) {
                    alert('Web Bluetooth haitumiki. Tafadhali tumia Chrome au Edge.');
                    return false;
                }

                this.isScanning = true;
                
                try {
                    this.device = await navigator.bluetooth.requestDevice({
                        acceptAllDevices: true,
                        optionalServices: ['generic_access']
                    });

                    if (!this.device) {
                        return false;
                    }

                    await this.device.gatt.connect();
                    
                    if (this.device.watchAdvertisements) {
                        await this.device.watchAdvertisements();
                        
                        this.device.addEventListener('advertisementreceived', (event) => {
                            const rssi = event.rssi;
                            const distance = this.calculateDistance(rssi);
                            
                            socket.emit('device-detected', {
                                deviceId: this.device.id,
                                deviceName: this.device.name || 'Unknown',
                                distance: distance,
                                rssi: rssi
                            });
                        });
                    } else {
                        this.simulateScanning();
                    }
                    
                    return true;
                } catch (error) {
                    console.error('Scan error:', error);
                    this.isScanning = false;
                    return false;
                }
            }

            simulateScanning() {
                let distance = 15;
                let decreasing = true;
                
                this.interval = setInterval(() => {
                    if (!this.isScanning) return;
                    
                    if (decreasing) {
                        distance -= 0.5;
                        if (distance <= 2) decreasing = false;
                    } else {
                        distance += 0.5;
                        if (distance >= 20) decreasing = true;
                    }
                    
                    socket.emit('device-detected', {
                        deviceId: 'SIMULATED-DEVICE',
                        deviceName: 'Simulated iPhone',
                        distance: distance,
                        rssi: -59 - 20 * Math.log10(distance)
                    });
                }, 3000);
            }

            stopScanning() {
                this.isScanning = false;
                if (this.interval) {
                    clearInterval(this.interval);
                    this.interval = null;
                }
                if (this.device && this.device.gatt?.connected) {
                    this.device.gatt.disconnect();
                }
            }
        }

        function startScanning() {
            if (isScanning) {
                alert('Utafutaji tayari unaendelea');
                return;
            }
            
            scanner = new BluetoothScanner();
            statusText.textContent = 'Inatafuta...';
            scanStatus.className = 'indicator scanning';
            startScanBtn.disabled = true;
            stopScanBtn.disabled = false;
            
            scanner.startScanning().then(success => {
                if (success) {
                    isScanning = true;
                    statusText.textContent = 'Inatafuta wanawake ndani ya mita 10...';
                } else {
                    stopScanning();
                    alert('Haiwezi kuanza utafutaji. Hakikisha Bluetooth imewashwa.');
                }
            });
        }

        function stopScanning() {
            if (scanner) {
                scanner.stopScanning();
            }
            isScanning = false;
            statusText.textContent = 'Utafutaji umesimama';
            scanStatus.className = 'indicator';
            startScanBtn.disabled = false;
            stopScanBtn.disabled = true;
        }

        function updateFemaleList(females) {
            if (females.length === 0) {
                femaleDevicesDiv.innerHTML = '<div class="empty-state">📱 Hakuna mwanamke aliye karibu ndani ya mita 10</div>';
                return;
            }
            
            femaleDevicesDiv.innerHTML = females.map(female => `
                <div class="device-card" onclick="selectFemale('${female.phoneNumber}', '${female.ownerName}')">
                    <h3>👩 ${female.ownerName}</h3>
                    <p>📞 ${female.phoneNumber}</p>
                    <p>📏 Umbali: ${female.distance?.toFixed(1) || '?'} mita</p>
                    <p>🕐 Aligunduliwa: ${new Date(female.timestamp).toLocaleTimeString()}</p>
                    <div class="button-group">
                        <button class="btn btn-sms" onclick="event.stopPropagation(); sendDirectSMS('${female.phoneNumber}', '${female.ownerName}')">📨 SMS</button>
                        <button class="btn btn-call" onclick="event.stopPropagation(); callDirect('${female.phoneNumber}', '${female.ownerName}')">📞 Simu</button>
                    </div>
                </div>
            `).join('');
        }

        // Function to select female and fill form
        window.selectFemale = (phone, name) => {
            commsPhone.value = phone;
            commsName.value = name;
            commsMessage.value = `Habari ${name}, nimekugundua kupitia tracker yetu. Uko karibu nami. Tungependa kuwasiliana nawe.`;
            
            // Highlight selected
            document.querySelectorAll('.device-card').forEach(card => {
                card.classList.remove('selected-device');
            });
            event.currentTarget.classList.add('selected-device');
            
            showCommsResult(`✅ Umemchagua ${name}. Sasa unaweza kumtumia SMS au kumpigia simu.`, 'info');
        };

        // Send SMS direct
        window.sendDirectSMS = (phone, name) => {
            commsPhone.value = phone;
            commsName.value = name;
            sendSMS();
        };

        // Call direct
        window.callDirect = (phone, name) => {
            commsPhone.value = phone;
            commsName.value = name;
            makeCall();
        };

        function sendSMS() {
            const phoneNumber = commsPhone.value;
            const name = commsName.value;
            const message = commsMessage.value;
            
            if (!phoneNumber) {
                showCommsResult('❌ Tafadhali ingiza namba ya simu', 'error');
                return;
            }
            
            if (!message) {
                showCommsResult('❌ Tafadhali andika ujumbe', 'error');
                return;
            }
            
            showCommsResult(`📨 Inatuma SMS kwa ${name || phoneNumber}...`, 'info');
            
            socket.emit('send-sms-to-female', {
                phoneNumber: phoneNumber,
                ownerName: name || 'Mwanamke',
                message: message,
                distance: 5
            });
        }

        function makeCall() {
            const phoneNumber = commsPhone.value;
            const name = commsName.value;
            
            if (!phoneNumber) {
                showCommsResult('❌ Tafadhali ingiza namba ya simu', 'error');
                return;
            }
            
            showCommsResult(`📞 Inampigia simu ${name || phoneNumber}...`, 'info');
            
            socket.emit('call-female', {
                phoneNumber: phoneNumber,
                ownerName: name || 'Mwanamke',
                distance: 5
            });
        }

        function showCommsResult(message, type) {
            commsResult.textContent = message;
            commsResult.className = `comms-result ${type}`;
            setTimeout(() => {
                commsResult.style.display = 'none';
                commsResult.className = 'comms-result';
            }, 5000);
        }

        async function addFemale() {
            const deviceId = newDeviceId.value;
            const deviceName = newDeviceName.value;
            const phoneNumber = newPhoneNumber.value;
            const ownerName = newOwnerName.value;
            
            if (!deviceId || !phoneNumber || !ownerName) {
                alert('Tafadhali jaza Device ID, Namba ya Simu, na Jina Kamili');
                return;
            }
            
            try {
                const response = await fetch('/api/females', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, deviceName, phoneNumber, ownerName })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ ${ownerName} ameongezwa kwenye database!`);
                    newDeviceId.value = '';
                    newDeviceName.value = '';
                    newPhoneNumber.value = '';
                    newOwnerName.value = '';
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error adding female contact');
            }
        }

        // Socket events
        socket.on('female-detected', (data) => {
            console.log('Female detected:', data);
            
            const exists = detectedFemales.find(f => f.deviceId === data.deviceId);
            if (!exists) {
                detectedFemales.unshift(data);
                if (detectedFemales.length > 20) detectedFemales.pop();
            } else {
                exists.distance = data.distance;
                exists.timestamp = data.timestamp;
            }
            
            updateFemaleList(detectedFemales);
            
            showCommsResult(`👩 ${data.ownerName} amegunduliwa umbali wa ${data.distance.toFixed(1)}m!`, 'success');
        });
        
        socket.on('unknown-device', (data) => {
            console.log('Unknown device:', data);
        });
        
        socket.on('sms-result', (data) => {
            if (data.success) {
                showCommsResult(`✅ SMS imetumwa kwa mafanikio! ${data.message || ''}`, 'success');
            } else {
                showCommsResult(`❌ Kosa: ${data.error || 'SMS haikutumwa'}`, 'error');
            }
        });
        
        socket.on('call-result', (data) => {
            if (data.success) {
                showCommsResult(`✅ Simu inapigwa! ${data.message || ''}`, 'success');
            } else {
                showCommsResult(`❌ Kosa: ${data.error || 'Simu haikupigwa'}`, 'error');
            }
        });

        // Event listeners
        startScanBtn.addEventListener('click', startScanning);
        stopScanBtn.addEventListener('click', stopScanning);
        sendSmsBtn.addEventListener('click', sendSMS);
        makeCallBtn.addEventListener('click', makeCall);
        addDeviceBtn.addEventListener('click', addFemale);
        
        // Set default message
        commsMessage.value = 'Habari, nimekugundua kupitia tracker yetu. Uko karibu nami ndani ya mita 10. Tungependa kuwasiliana nawe.';

        console.log('✅ Female Phone Tracker Ready!');
    </script>
</body>
</html>
