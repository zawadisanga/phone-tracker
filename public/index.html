<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Female Phone Tracker - 10 Meters</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>👩 Female Phone Tracker</h1>
            <p>Gundua na ufuatilie namba za simu za wanawake ndani ya mita 10</p>
        </header>

        <div class="controls">
            <button id="startScanBtn" class="btn btn-primary">
                🔍 Anza Utafutaji
            </button>
            <button id="stopScanBtn" class="btn btn-secondary" disabled>
                ⏹️ Simamisha
            </button>
        </div>

        <div class="status-card">
            <div class="status-indicator">
                <div class="indicator" id="scanStatus"></div>
                <span id="statusText">Hajajaanza</span>
            </div>
            <div id="distanceInfo" class="distance-info"></div>
        </div>

        <div class="section">
            <h2>👩 Wanawake Waliogunduliwa (Mita 10)</h2>
            <div id="femaleDevices" class="devices-list">
                <div class="empty-state">
                    <span class="icon">👩</span>
                    <p>Hakuna mwanamke aliye karibu (mita 10)</p>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>📚 Database ya Wanawake</h2>
            <button id="showDbBtn" class="btn btn-outline">Orodha ya Wanawake Waliojitolea</button>
            <div id="deviceDatabase" style="display: none;">
                <div id="deviceList"></div>
                <div class="add-device-form">
                    <h3>➕ Ongeza Mwanamke Mpya</h3>
                    <input type="text" id="newDeviceId" placeholder="Device ID (kwa mfano: FATMA-001)" class="input">
                    <input type="text" id="newDeviceName" placeholder="Jina la Kifaa" class="input">
                    <input type="tel" id="newPhoneNumber" placeholder="Namba ya Simu (+255...)" class="input">
                    <input type="text" id="newOwnerName" placeholder="Jina Kamili" class="input">
                    <button id="addDeviceBtn" class="btn btn-success">Ongeza Mwanamke</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h2>💬 Wasiliana na Mwanamke Aliyegunduliwa</h2>
            <div class="comms-panel">
                <input type="tel" id="commsPhone" placeholder="Namba ya simu ya mwanamke" class="input">
                <textarea id="commsMessage" placeholder="Ujumbe wako kwa mwanamke huyu..." rows="3" class="input"></textarea>
                <div class="comms-buttons">
                    <button id="sendSmsBtn" class="btn btn-sms">📨 Tuma SMS</button>
                    <button id="makeCallBtn" class="btn btn-call">📞 Piga Simu</button>
                </div>
                <div id="commsResult" class="comms-result"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="js/bluetooth-scanner.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
