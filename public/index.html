<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Female Phone Tracker - Test Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: white;
            text-align: center;
            margin-bottom: 20px;
        }
        h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }
        input, textarea, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background: #5a67d8;
        }
        .btn-sms {
            background: #17a2b8;
        }
        .btn-call {
            background: #28a745;
        }
        .btn-danger {
            background: #dc3545;
        }
        .result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }
        .result.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .result.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .result.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .status {
            background: #e8f4f8;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }
        .online {
            color: #28a745;
            font-weight: bold;
        }
        .offline {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>👩 Female Phone Tracker</h1>
        
        <div class="card">
            <h2>📡 Server Status</h2>
            <div class="status" id="serverStatus">
                Inaangalia server...
            </div>
        </div>

        <div class="card">
            <h2>📨 Tuma SMS kwa Mwanamke</h2>
            <input type="tel" id="phoneNumber" placeholder="Namba ya Simu (+255...)" value="+255712345678">
            <input type="text" id="ownerName" placeholder="Jina la Mwanamke" value="Fatma">
            <textarea id="message" rows="4" placeholder="Andika ujumbe wako hapa...">Habari Fatma, nimekugundua kupitia tracker yetu. Uko karibu nami ndani ya mita 10. Tungependa kuwasiliana nawe.</textarea>
            <button id="sendSmsBtn" class="btn-sms">📨 TUMA SMS</button>
            <button id="makeCallBtn" class="btn-call">📞 PIGA SIMU</button>
            <div id="result" class="result"></div>
        </div>

        <div class="card">
            <h2>👩 Wanawake Waliopo Kwenye Database</h2>
            <button id="loadFemalesBtn">📋 ORODHA YA WANAWAKE</button>
            <div id="femalesList" style="margin-top: 15px;"></div>
        </div>

        <div class="card">
            <h2>➕ Ongeza Mwanamke Mpya</h2>
            <input type="text" id="newDeviceId" placeholder="Device ID (kwa mfano: FATMA-001)">
            <input type="text" id="newDeviceName" placeholder="Jina la Kifaa">
            <input type="tel" id="newPhoneNumber" placeholder="Namba ya Simu">
            <input type="text" id="newOwnerName" placeholder="Jina Kamili">
            <button id="addFemaleBtn" style="background: #28a745;">➕ Ongeza Mwanamke</button>
        </div>

        <div class="card">
            <h2>🔍 Test Gender Detection</h2>
            <input type="text" id="testName" placeholder="Ingiza jina (kwa mfano: Fatma)">
            <button id="testGenderBtn">🔍 GUNDUA JINSIA</button>
            <div id="genderResult" style="margin-top: 10px; padding: 10px; background: #f8f9fa; border-radius: 8px;"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        
        // DOM elements
        const serverStatus = document.getElementById('serverStatus');
        const phoneNumber = document.getElementById('phoneNumber');
        const ownerName = document.getElementById('ownerName');
        const message = document.getElementById('message');
        const sendSmsBtn = document.getElementById('sendSmsBtn');
        const makeCallBtn = document.getElementById('makeCallBtn');
        const resultDiv = document.getElementById('result');
        const loadFemalesBtn = document.getElementById('loadFemalesBtn');
        const femalesList = document.getElementById('femalesList');
        const addFemaleBtn = document.getElementById('addFemaleBtn');
        const testGenderBtn = document.getElementById('testGenderBtn');
        const testName = document.getElementById('testName');
        const genderResult = document.getElementById('genderResult');
        
        // New female inputs
        const newDeviceId = document.getElementById('newDeviceId');
        const newDeviceName = document.getElementById('newDeviceName');
        const newPhoneNumber = document.getElementById('newPhoneNumber');
        const newOwnerName = document.getElementById('newOwnerName');
        
        // Check server status
        async function checkServer() {
            try {
                const response = await fetch('/health');
                const data = await response.json();
                if (data.status === 'ok') {
                    serverStatus.innerHTML = '✅ Server Iko Online | ' + 
                        `Wanawake wanaofuatiliwa: ${data.females_tracked}<br>` +
                        `🕐 ${new Date(data.timestamp).toLocaleString()}`;
                } else {
                    serverStatus.innerHTML = '❌ Server Iko Offline';
                }
            } catch (error) {
                serverStatus.innerHTML = '❌ Haiwezi kuunganisha kwenye server. Hakikisha server imeanza.';
            }
        }
        
        // Show result
        function showResult(message, type) {
            resultDiv.textContent = message;
            resultDiv.className = `result ${type}`;
            setTimeout(() => {
                resultDiv.style.display = 'none';
                resultDiv.className = 'result';
            }, 5000);
        }
        
        // Send SMS
        function sendSMS() {
            const phone = phoneNumber.value;
            const name = ownerName.value;
            const msg = message.value;
            
            if (!phone) {
                showResult('❌ Tafadhali ingiza namba ya simu', 'error');
                return;
            }
            
            showResult(`📨 Inatuma SMS kwa ${name || phone}...`, 'info');
            
            socket.emit('send-sms-to-female', {
                phoneNumber: phone,
                ownerName: name || 'Mwanamke',
                message: msg,
                distance: 5
            });
        }
        
        // Make call
        function makeCall() {
            const phone = phoneNumber.value;
            const name = ownerName.value;
            
            if (!phone) {
                showResult('❌ Tafadhali ingiza namba ya simu', 'error');
                return;
            }
            
            showResult(`📞 Inampigia simu ${name || phone}...`, 'info');
            
            socket.emit('call-female', {
                phoneNumber: phone,
                ownerName: name || 'Mwanamke',
                distance: 5
            });
        }
        
        // Load all females
        async function loadFemales() {
            try {
                const response = await fetch('/api/females');
                const data = await response.json();
                
                if (data.success && data.females.length > 0) {
                    let html = '<div style="max-height: 300px; overflow-y: auto;">';
                    data.females.forEach(female => {
                        html += `
                            <div style="background: #f8f9fa; padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #e83e8c;">
                                <strong>👩 ${female.ownerName}</strong><br>
                                📞 ${female.phoneNumber}<br>
                                🆔 ${female.deviceId}<br>
                                <small>📅 ${new Date(female.registeredAt).toLocaleString()}</small>
                            </div>
                        `;
                    });
                    html += '</div>';
                    femalesList.innerHTML = html;
                } else {
                    femalesList.innerHTML = '<p>📭 Hakuna wanawake kwenye database. Ongeza mmoja.</p>';
                }
            } catch (error) {
                femalesList.innerHTML = '<p>❌ Kosa la kupakia data</p>';
            }
        }
        
        // Add new female
        async function addFemale() {
            const deviceId = newDeviceId.value;
            const deviceName = newDeviceName.value;
            const phone = newPhoneNumber.value;
            const name = newOwnerName.value;
            
            if (!deviceId || !phone || !name) {
                alert('Tafadhali jaza Device ID, Namba ya Simu, na Jina Kamili');
                return;
            }
            
            try {
                const response = await fetch('/api/females', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ deviceId, deviceName, phoneNumber: phone, ownerName: name })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert(`✅ ${name} ameongezwa kwenye database!`);
                    newDeviceId.value = '';
                    newDeviceName.value = '';
                    newPhoneNumber.value = '';
                    newOwnerName.value = '';
                    loadFemales();
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
        
        // Test gender detection
        async function testGender() {
            const name = testName.value;
            if (!name) {
                genderResult.innerHTML = '<span style="color: red;">Tafadhali ingiza jina</span>';
                return;
            }
            
            try {
                const response = await fetch(`/api/detect-gender?name=${encodeURIComponent(name)}`);
                const data = await response.json();
                
                let genderText = '';
                let color = '';
                
                if (data.gender === 'female') {
                    genderText = '👩 MWANAMKE';
                    color = '#28a745';
                } else if (data.gender === 'male') {
                    genderText = '👨 MWANAUME';
                    color = '#dc3545';
                } else {
                    genderText = '❓ HAJUULIKANI';
                    color = '#ffc107';
                }
                
                genderResult.innerHTML = `
                    <strong>Jina:</strong> ${name}<br>
                    <strong>Jinsia:</strong> <span style="color: ${color}; font-weight: bold;">${genderText}</span><br>
                    <strong>Uhakika:</strong> ${(data.confidence * 100).toFixed(1)}%<br>
                    <strong>Mbinu:</strong> ${data.methods?.map(m => m.method).join(', ') || data.method || 'database'}<br>
                    <strong>Alama:</strong> ${data.finalScore ? (data.finalScore * 100).toFixed(1) + '%' : 'N/A'}
                `;
            } catch (error) {
                genderResult.innerHTML = '<span style="color: red;">Kosa la kuangalia jinsia</span>';
            }
        }
        
        // Socket events
        socket.on('sms-result', (data) => {
            if (data.success) {
                showResult(`✅ SMS imetumwa kwa mafanikio! ${data.message || ''}`, 'success');
            } else {
                showResult(`❌ Kosa: ${data.error || 'SMS haikutumwa'}`, 'error');
            }
        });
        
        socket.on('call-result', (data) => {
            if (data.success) {
                showResult(`✅ Simu inapigwa! ${data.message || ''}`, 'success');
            } else {
                showResult(`❌ Kosa: ${data.error || 'Simu haikupigwa'}`, 'error');
            }
        });
        
        socket.on('connect', () => {
            console.log('Connected to server');
            checkServer();
        });
        
        // Event listeners
        sendSmsBtn.addEventListener('click', sendSMS);
        makeCallBtn.addEventListener('click', makeCall);
        loadFemalesBtn.addEventListener('click', loadFemales);
        addFemaleBtn.addEventListener('click', addFemale);
        testGenderBtn.addEventListener('click', testGender);
        
        // Initial load
        checkServer();
        
        console.log('✅ Female Phone Tracker Test Version Ready!');
        console.log('💡 Hakikisha server imeanza: node server.js');
        console.log('🌐 Kisha fungua: http://localhost:3000');
    </script>
</body>
</html>
